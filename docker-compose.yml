services:
  db:
    image: postgres:16-alpine
    container_name: devcard_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: devcard
      POSTGRES_PASSWORD: devcard_dev_only
      POSTGRES_DB: devcard
    ports:
      - "5432:5432"
    volumes:
      - devcard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devcard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  devcard_pgdata: